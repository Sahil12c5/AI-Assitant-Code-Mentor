# ============================================================
# Adaptive AI Coding Mentor - Configuration
# Values are read from environment variables first, with these as fallbacks.
# ============================================================

# Database Configuration
db.url=jdbc:mysql://localhost:3306/ai_coding_mentor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=
db.pool.size=10

# LLM Configuration
llm.api.key=${LLM_API_KEY}
llm.model=${LLM_MODEL:gemini-2.0-flash}
llm.api.url=https://generativelanguage.googleapis.com/v1beta/models
llm.timeout.seconds=30
llm.max.retries=1

# Code Runner Configuration
runner.timeout.seconds=5
runner.max.output.bytes=10000
runner.use.docker=false
runner.docker.image=openjdk:17-slim

# Application Configuration
app.name=Adaptive AI Coding Mentor
app.version=1.0.0
